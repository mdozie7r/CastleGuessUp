      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the APK
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk FakeHeadzUp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FakeHeadzUp-apk
          path: FakeHeadzUp.apk

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" FakeHeadzUp.apk --title "Marshall's Fake Headz Up build ${{ github.run_number }}" --notes "Tap FakeHeadzUp.apk below to download and install."
