      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the APK
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk CastleGuessUp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CastleGuessUp-apk
          path: CastleGuessUp.apk

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" CastleGuessUp.apk --title "Castle Guess-Up build ${{ github.run_number }}" --notes "Tap CastleGuessUp.apk below to download and install."
